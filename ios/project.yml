# 拾日 iOS：xcodegen generate 生成 Dayweave.xcodeproj（工程文件不进仓库）。
name: Dayweave
options:
  bundleIdPrefix: app.dayweave
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 97M5J4K9WG
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dayweave:
    type: application
    platform: iOS
    sources:
      - path: Dayweave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayweave
        PRODUCT_NAME: Dayweave
        INFOPLIST_FILE: Dayweave/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # 拾日云地址，打包时可用 xcodebuild DAYWEAVE_CLOUD_URL=… 覆盖；空字符串表示没有云端
        DAYWEAVE_CLOUD_URL: https://api.duanjl.com/dayweave
    scheme:
      storeKitConfiguration: Dayweave/Resources/Dayweave.storekit
